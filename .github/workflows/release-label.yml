name: Release label

# Every pull request needs one of the labels in .github/release-drafter.yml, so the release notes
# and the next version know what it is.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter/check-pr@v7
