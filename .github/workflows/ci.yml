name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    # Package.swift needs Swift 6 tools, so pin macOS 15 and an Xcode 16 toolchain (Swift 6.1).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Build
        run: swift build
      - name: Lint
        run: swift format lint --strict --recursive Sources Tests
      - name: Test
        run: swift test
