name: Release

# On every push to main, Release Drafter updates the draft release (notes and next version) from
# the merged pull requests' labels. Nothing is published until someone runs this workflow by hand
# (Actions → Release → Run workflow): then it builds the app with the resolved version, attaches
# the zip and publishes the draft, which creates the tag.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Update the draft release
        id: draft
        uses: release-drafter/release-drafter@v7
        with:
          commitish: ${{ github.sha }}

      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'

      - name: Select Xcode 16.4
        if: github.event_name == 'workflow_dispatch'
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Set the version
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.draft.outputs.resolved_version }}
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist

      - name: Build, sign and zip
        if: github.event_name == 'workflow_dispatch'
        run: scripts/build-app.sh

      - name: Publish the release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.draft.outputs.tag_name }}
          VERSION: ${{ steps.draft.outputs.resolved_version }}
        run: |
          # One unversioned zip per release keeps releases/latest/download/CodexResetRadar.zip stable.
          mv "dist/CodexResetRadar-$VERSION.zip" dist/CodexResetRadar.zip
          gh release upload "$TAG" dist/CodexResetRadar.zip --clobber
          gh release edit "$TAG" --draft=false --latest
