name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' is not of the form vX.Y.Z" >&2
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build, sign and zip
        run: scripts/build-app.sh

      - name: Extract release notes
        run: scripts/changelog-section.sh "$VERSION" > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s release-notes.md ]; then
            NOTES=(--notes-file release-notes.md)
          else
            echo "No CHANGELOG.md section for $VERSION, generating notes" >&2
            NOTES=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" "dist/CodexResetRadar-$VERSION.zip" \
            --title "$GITHUB_REF_NAME" --verify-tag "${NOTES[@]}"
