# Release notes and the next version come from the labels of the pull requests merged since the
# last release. The release workflow publishes only when a change is labelled breaking,
# enhancement, bug or accessibility; documentation and maintenance changes wait in the draft.
name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
change-template: "- $TITLE (#$NUMBER)"
change-title-escapes: '\<*_&'
categories:
  - title: "Breaking changes"
    semver-increment: major
    exclusive: true
    when:
      label: breaking
  - title: "Added"
    semver-increment: minor
    exclusive: true
    when:
      label: enhancement
  - title: "Fixed"
    semver-increment: patch
    exclusive: true
    when:
      label: bug
  - title: "Accessibility"
    semver-increment: patch
    exclusive: true
    when:
      label: accessibility
  - title: "Documentation"
    semver-increment: patch
    exclusive: true
    when:
      label: documentation
  - title: "Maintenance"
    semver-increment: patch
    when:
      label: maintenance
  - type: version-resolver
    semver-increment: patch
template: |
  $CHANGES

  ## Install

  Download `CodexResetRadar-$RESOLVED_VERSION.zip`, unzip it and drag **Codex Reset Radar.app**
  to Applications. The first time, macOS blocks it: see the
  [README](https://github.com/mpellicc/codex-reset-radar#install) for how to open it.
