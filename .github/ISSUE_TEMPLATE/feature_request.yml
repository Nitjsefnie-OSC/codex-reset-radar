name: Feature request
description: Suggest an improvement to Codex Reset Radar
labels: ["needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or problem behind the request.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: How you imagine it working. Alternatives you considered are welcome too.
    validations:
      required: true
